const cv=document.getElementById('screen'),g=cv.getContext('2d'); g.imageSmoothingEnabled=true; try{g.imageSmoothingQuality='high'}catch(e){}

let difficulty='normal',fouls=0,combo=0,hitFreeze=0,ring=0,imgs={},mode='intro',shots=10,score=0,hits=0,homers=0,streak=0,best=0,mute=false,last=0,clock=0,pitch=null,recover=0,bannerEnd=0,cameraShake=0,flash=0,batTimer=0,cheerTimer=0,hitBall=null,particles=[];
try{best=Number(localStorage.getItem('maru_v14_7_best')||localStorage.getItem('maru_v14_6_best')||localStorage.getItem('maru_v14_3_best')||0)}catch(e){}

function label(txt,x,y,size=18,color='#fff',stroke){g.font=`900 ${size}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';if(stroke){g.strokeStyle=stroke;g.lineWidth=4;g.strokeText(txt,x,y)}g.fillStyle=color;g.fillText(txt,x,y)}

function oval(x,y,rx,ry,color,ang=0){g.beginPath();g.ellipse(x,y,rx,ry,ang,0,Math.PI*2);g.fillStyle=color;g.fill()}
function poly(pts,color){g.beginPath();g.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)g.lineTo(...pts[i]);g.closePath();g.fillStyle=color;g.fill()}

function drawSprite(im,cx,cy,w,rot=0,alpha=1,flip=false){if(!im)return; const h=w*(im.height/im.width); g.save(); g.translate(cx,cy); if(flip) g.scale(-1,1); g.rotate(rot); g.globalAlpha=alpha; g.drawImage(im,-w/2,-h/2,w,h); g.restore(); return h;}
function ball(x,y,r,a=1){g.save();g.globalAlpha=a;
 if(pitchBallImage.complete&&pitchBallImage.naturalWidth){g.drawImage(pitchBallImage,x-r,y-r,2*r,2*r)}
 else{oval(x,y,r,r,'#fffaf3');g.beginPath();g.arc(x,y,r*.67,-1.2,1.32);g.lineWidth=Math.max(1.4,r*.14);g.strokeStyle='#c73a31';g.stroke()}

function sound(f=440,t=.14,type='triangle',vol=.06){if(mute)return; try{const ac=window._maruAudio||(window._maruAudio=new (window.AudioContext||window.webkitAudioContext)()); const osc=ac.createOscillator(), amp=ac.createGain(); osc.type=type; osc.frequency.setValueAtTime(f,ac.currentTime); osc.frequency.exponentialRampToValueAtTime(Math.max(65,f*.55),ac.currentTime+t); amp.gain.setValueAtTime(vol,ac.currentTime); amp.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t); osc.connect(amp); amp.connect(ac.destination); osc.start(); osc.stop(ac.currentTime+t); }catch(e){}}
// Arcade baseball sound design: synthesized locally, no network/files required.
let crowdBuffers=null;
function audioContext(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;const ac=window._maruAudio||(window._maruAudio=new AC());if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}catch(e){return null}}
function tone(ac,start,f,duration,vol=.12,type='sine',endF=f){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(30,f),start);o.frequency.exponentialRampToValueAtTime(Math.max(30,endF),start+duration);v.gain.setValueAtTime(.001,start);v.gain.exponentialRampToValueAtTime(Math.max(.002,vol),start+.006);v.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(v);v.connect(ac.destination);o.start(start);o.stop(start+duration+.02)}
function noise(ac,start,duration,vol=.07,filter='highpass',cutoff=1200){const len=Math.ceil(ac.sampleRate*duration),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);const n=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();n.buffer=b;f.type=filter;f.frequency.value=cutoff;v.gain.setValueAtTime(.001,start);v.gain.linearRampToValueAtTime(vol,start+.015);v.gain.exponentialRampToValueAtTime(.001,start+duration);n.connect(f);f.connect(v);v.connect(ac.destination);n.start(start);n.stop(start+duration+.005)}
function sfx(kind){if(mute)return;const ac=audioContext();if(!ac)return;const t=ac.currentTime+.009;
 if(kind==='swing'){noise(ac,t,.16,.105,'bandpass',1400);tone(ac,t,420,.13,.044,'sawtooth',105)}
 else if(kind==='miss'){noise(ac,t,.19,.075,'lowpass',850);tone(ac,t,170,.14,.045,'triangle',76)}
 else if(kind==='hit'||kind==='homer'||kind==='foul'){
   const big=kind==='homer',foul=kind==='foul';
   noise(ac,t,foul?.07:.11,foul?.10:.19,'highpass',1900);
   tone(ac,t,foul?1350:1550,foul?.16:big?.83:.42,foul?.065:big?.17:.13,'sine',foul?1060:big?910:1120);
   tone(ac,t,foul?2320:2670,foul?.11:big?.73:.36,foul?.037:big?.095:.067,'sine',foul?2000:big?1840:2230);
   tone(ac,t,foul?3600:3900,foul?.065:big?.44:.24,.025,'triangle',foul?2900:3000);
   if(big){tone(ac,t+.07,810,.7,.055,'sine',620);noise(ac,t+.11,.23,.025,'bandpass',2100)}
 }
 else if(kind==='cheer'){
   // Stadium cheers: many layered voices plus rhythmic hand-claps, 2.8s decay.
   noise(ac,t,2.8,.09,'bandpass',610);
   noise(ac,t+.10,2.3,.05,'bandpass',1550);
   for(let i=0;i<25;i++){const tt=t+.02+Math.random()*1.6;const f=170+Math.random()*340;tone(ac,tt,f,.34+Math.random()*.45,.004+Math.random()*.006,'triangle',f*(.76+Math.random()*.4))}
   for(let i=0;i<22;i++){const tt=t+.08+i*.095+Math.random()*.04;noise(ac,tt,.045+Math.random()*.035,.13,'highpass',1500)}
 }
}

function drawTiger(t){
  const baseX=235,baseY=478;
  let rot=Math.sin(t*2.0)*.01,bob=Math.sin(t*2.0)*1.5,width=103,dx=0,stretch=1;
  let sprite=imgs.tigerWindup;
  if(mode==='windup'){
    const u=clamp(1-recover/590,0,1);
    sprite=imgs.tigerWindup;
    if(u<.26){const e=ease(u/.26);rot=-.03-.11*e;bob=-2*e;dx=-2*e;}
    else if(u<.68){const e=ease((u-.26)/.42);rot=-.14-.18*e;bob=-2-10*e;dx=-2-7*e;}
    else {const e=ease((u-.68)/.32);rot=-.32+.50*e;bob=-12+11*e;dx=-9+16*e;}
    width=105+3*Math.sin(u*Math.PI);
  }else if(mode==='pitch'&&pitch){
    const p=clamp(pitch.progress,0,1);
    // Keep the pitcher in the throwing/follow-through pose for most of the pitch
    // so the ball feels like it was actually released from the hand.
    if(p<.08){
      sprite=imgs.tigerWindup;
      const e=ease(clamp(p/.08,0,1));
      rot=.02-.18*e; dx=3-10*e; bob=-2+4*e; width=105-3.4*e; stretch=1+.03*(1-e);
    } else {
